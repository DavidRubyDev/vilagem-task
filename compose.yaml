services:
  node:
    # Must equal the @playwright/test version in package.json; bump both together.
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /app
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      npm_config_cache: /app/var/cache/npm
      CI: '${CI:-}'
    init: true
    ipc: host
    # Playwright's request context looks hosts up for IPv6 as well and waits for it. The single-label container name
    # has no IPv6 address, and the host's search domains sent that lookup to the host's DNS servers, which took up to
    # 10 s. Without search domains the lookup fails at once.
    dns_search: .
    command: ['sh', '-c', 'npm ci --no-audit --no-fund && npm run build']

  app:
    build: .
    # Named so the test project (compose.test.yaml) reuses the same image.
    image: parcel-map-app
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    networks:
      default:
        aliases:
          # Chromium treats the single-label host "app" as the HSTS-preloaded .app TLD and upgrades
          # it to HTTPS, so the E2E tests reach the app under this name instead.
          - parcel-map
    depends_on:
      node:
        condition: service_completed_successfully
    environment:
      COMPOSER_CACHE_DIR: /app/var/cache/composer
      # The built-in server forks workers, so one slow request does not block the others.
      PHP_CLI_SERVER_WORKERS: '8'
    command:
      - sh
      - -c
      - composer install --no-interaction --no-progress && exec php -S 0.0.0.0:8000 -t public
    healthcheck:
      test: ['CMD', 'php', '-r', "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 2s
      timeout: 2s
      retries: 60
