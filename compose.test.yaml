# Overrides for the test project (docker compose -p parcel-map-test): fixture data, no published port,
# so running the tests never touches a developer's running app.
# The project also has its own node_modules and frontend build (var/e2e/, made by `make e2e-assets`), so the dev
# stack, `make assets` and `make watch`, which rewrite the shared ones, cannot change them during an E2E run.
services:
  app:
    ports: !reset []
    environment:
      PARCEL_MAP_DATA_DIR: tests/Fixtures/data
    volumes:
      - ./var/e2e/build:/app/public/build:ro
  node:
    volumes:
      - ./var/e2e/node_modules:/app/node_modules
      - ./var/e2e/build:/app/public/build
